<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomokdon Profile Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #eceff3;
      --cyan: #15d9e8;
      --blue: #2276ff;
      --deep: #07141a;
      --soft: #e9fbff;
      --yellow: #fff2c9;
      --yellow-text: #d18a00;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      padding: 32px;
    }

    .profile-card {
      width: 920px;
      min-height: 248px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 34px;
      padding: 26px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 1px;
      background: linear-gradient(120deg, rgba(21,217,232,.75), rgba(34,118,255,.18), rgba(255,255,255,0));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .visual {
      min-height: 196px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 18% 20%, rgba(21, 217, 232, .26), transparent 24%),
        radial-gradient(circle at 86% 18%, rgba(34, 118, 255, .24), transparent 30%),
        linear-gradient(135deg, #071216 0%, #08242a 44%, #061014 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .visual::before {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 34px solid rgba(255,255,255,.06);
      right: -80px;
      top: -72px;
    }

    .visual::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 42px;
      border: 1px solid rgba(21,217,232,.22);
      transform: rotate(18deg);
      left: -58px;
      bottom: -70px;
    }

    .mark {
      width: 128px;
      height: 128px;
      border-radius: 34px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
      box-shadow: 0 22px 60px rgba(0,0,0,.28);
    }

    .door {
      position: absolute;
      inset: 25px 30px 24px;
      border-radius: 999px 999px 22px 22px;
      background: linear-gradient(160deg, var(--cyan), var(--blue));
      box-shadow: 0 0 38px rgba(21,217,232,.38);
    }

    .door::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 21px;
      width: 24px;
      height: 56px;
      border-radius: 999px 999px 10px 10px;
      background: #07141a;
      opacity: .84;
    }

    .path {
      position: absolute;
      left: 31px;
      right: 25px;
      bottom: 23px;
      height: 14px;
      border-radius: 999px;
      background: #fff;
      transform: skewX(-24deg);
      opacity: .95;
    }

    .content {
      padding: 4px 8px 2px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .chips {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 14px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .chip.blue { background: var(--soft); color: #04b9d0; }
    .chip.yellow { background: var(--yellow); color: var(--yellow-text); }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -.055em;
    }

    .subtitle {
      margin: 12px 0 0;
      font-size: 19px;
      font-weight: 700;
      color: #4b5563;
      letter-spacing: -.035em;
      line-height: 1.45;
    }

    .desc {
      margin: 12px 0 0;
      max-width: 500px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      word-break: keep-all;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 22px;
      gap: 16px;
    }

    .tags { display: flex; gap: 8px; flex-wrap: wrap; }

    .tag {
      padding: 8px 12px;
      border-radius: 11px;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 14px;
      font-weight: 750;
    }

    .metrics {
      display: flex;
      gap: 16px;
      color: #6b7280;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .bookmark {
      position: absolute;
      top: 26px;
      right: 26px;
      width: 22px;
      height: 28px;
      border: 3px solid #6b7280;
      border-bottom: 0;
      border-radius: 5px 5px 1px 1px;
      opacity: .75;
    }

    .bookmark::after {
      content: "";
      position: absolute;
      left: -3px;
      right: -3px;
      bottom: -10px;
      height: 16px;
      background: white;
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
      border-left: 3px solid #6b7280;
      border-right: 3px solid #6b7280;
    }

    @media (max-width: 780px) {
      .profile-card {
        width: min(100%, 430px);
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .visual { min-height: 210px; }
      h1 { font-size: 30px; }
      .subtitle { font-size: 17px; }
      .bottom { align-items: flex-start; flex-direction: column; }
      .metrics { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <article class="profile-card">
    <div class="visual" aria-label="Nomokdon abstract housing access visual">
      <div class="mark">
        <div class="door"></div>
        <div class="path"></div>
      </div>
    </div>

    <section class="content">
      <div class="bookmark"></div>

      <div class="chips">
        <span class="chip blue">AI 기반 금융</span>
        <span class="chip yellow">결제/정산</span>
        <span class="chip blue">RWA</span>
      </div>

      <h1>Nomokdon</h1>
      <p class="subtitle">외국인을 위한 XRPL 기반 주거 보증금 솔루션</p>
      <p class="desc">
        목돈 없이 한국 주거 시장에 진입할 수 있도록 보증금 부담을 낮추고,
        월세 납부 이력을 신뢰 데이터로 전환하는 주거 금융 인프라입니다.
      </p>

      <div class="bottom">
        <div class="tags">
          <span class="tag"># 부동산</span>
          <span class="tag"># XRPL</span>
          <span class="tag"># 외국인 금융</span>
        </div>
        <div class="metrics">
          <span>💬 0</span>
          <span>♡ 1</span>
          <span>👥 3</span>
        </div>
      </div>
    </section>
  </article>
</body>
</html>
